# docker-compose.yml — Student Data Management System
# Run with: docker compose up --build
# Three services: db (MySQL 8.0), app (Flask), nginx (reverse proxy)
# Two networks: backend (db ↔ app) and frontend (app ↔ nginx)

services:

  # ── 1. MySQL Database ───────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      # Persist data across container restarts
      - mysql_data:/var/lib/mysql
      # Auto-run schema + seed on first start
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - backend
    # db port is intentionally NOT exposed to the host

  # ── 2. Flask Application ────────────────────────────────────────────────────
  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      DB_HOST:     db            # Docker service name — NOT localhost
      DB_PORT:     3306
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY:  ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy   # Wait until MySQL passes the healthcheck
    networks:
      - backend    # can reach db
      - frontend   # can be reached by nginx
    # app port is intentionally NOT exposed to the host (only nginx faces outside)

  # ── 3. Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"    # Only port exposed to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend   # can reach app; CANNOT reach db directly (security)

# ── Named volume ───────────────────────────────────────────────────────────────
volumes:
  mysql_data:

# ── Networks (two-tier segmentation) ──────────────────────────────────────────
networks:
  backend:    # db ↔ app
  frontend:   # app ↔ nginx
