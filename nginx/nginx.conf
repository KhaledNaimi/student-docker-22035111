# nginx/nginx.conf — Reverse proxy for the Student Data Management System

server {
    listen 80;
    server_name _;          # accept any hostname / IP

    # ── Proxy all requests to the Flask app container ──────────────────────────
    # "app" is the Docker Compose service name — Docker's internal DNS resolves it
    location / {
        proxy_pass         http://app:8000;

        # Required proxy headers so the app sees the real client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for slower DB queries
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # ── Optional: serve a custom 502 page if the app is down ───────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
