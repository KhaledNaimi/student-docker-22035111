{% extends "base.html" %}
{% block title %}{{ action }} Student{% endblock %}

{% block content %}
<div class="page-header">
  <h1>
    <i class="bi bi-person-{% if action == 'Add' %}plus{% else %}gear{% endif %} me-2 text-danger"></i>
    {{ action }} Student
  </h1>
</div>

<div class="card shadow-sm" style="max-width:720px;">
  <div class="card-body p-4">
    <form method="post" novalidate>

      <h6 class="text-uppercase text-muted fw-bold small mb-3">Personal Information</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">First Name <span class="text-danger">*</span></label>
          <input type="text" name="first_name" class="form-control"
                 value="{{ student.first_name if student else '' }}" required maxlength="80" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Last Name <span class="text-danger">*</span></label>
          <input type="text" name="last_name" class="form-control"
                 value="{{ student.last_name if student else '' }}" required maxlength="80" />
        </div>
        <div class="col-md-6">
          <label class="form-label">National / University ID <span class="text-danger">*</span></label>
          <input type="text" name="national_id" class="form-control"
                 value="{{ student.national_id if student else '' }}" required maxlength="20" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control"
                 value="{{ student.email if student else '' }}" required maxlength="150" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
          <input type="date" name="date_of_birth" class="form-control"
                 value="{{ student.date_of_birth if student else '' }}" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Gender <span class="text-danger">*</span></label>
          <select name="gender" class="form-select" required>
            {% for g in ['Male','Female','Other'] %}
              <option value="{{ g }}"
                {% if student and student.gender == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <hr class="my-3" />
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Academic Information</h6>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Department <span class="text-danger">*</span></label>
          <input type="text" name="department" class="form-control"
                 value="{{ student.department if student else '' }}" required maxlength="100" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Enrollment Date <span class="text-danger">*</span></label>
          <input type="date" name="enrollment_date" class="form-control"
                 value="{{ student.enrollment_date if student else '' }}" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">GPA (0.00 – 4.00)</label>
          <input type="number" name="gpa" class="form-control"
                 value="{{ '%.2f'|format(student.gpa) if student else '0.00' }}"
                 min="0" max="4" step="0.01" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Status <span class="text-danger">*</span></label>
          <select name="status" class="form-select" required>
            {% for st in ['Active','Graduated','Suspended'] %}
              <option value="{{ st }}"
                {% if student and student.status == st %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-check-lg me-1"></i>{{ action }} Student
        </button>
        <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
